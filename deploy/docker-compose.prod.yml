# This compose deployment replaces the existing zoubeacon-nginx single
# container after the cutover steps in deploy/README.md are completed.
# The collected-data bind mount persists acquisition outputs across restarts.
# jpsskill runs on the internal network only and is opt-in: use --profile ai to start it.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - ../data/collected:/app/data/collected
    expose:
      - "8000"

  jpsskill:
    profiles: ["ai"]
    build:
      context: /opt/jppskill
      dockerfile: Dockerfile
    env_file: ./jpsskill.env
    restart: unless-stopped
    expose:
      - "8100"
    volumes:
      - /opt/jppskill-data:/app/data

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - ../data/collected:/app/data/collected
    # --loop 0 is the service's intentional steady state. restart remains a
    # crash-recovery fallback, not the normal way to begin another poll cycle.
    command: ["python", "/app/scripts/collection_worker.py", "--loop", "0", "--interval", "10"]

  report-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    volumes:
      - ../data/collected:/app/data/collected
    command: ["python", "-m", "app.report_worker"]

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    # The collected-data mount is what lets the QA sweep read the snapshot files
    # it verifies; without it the hash check can only report missing files.
    volumes:
      - ../data/collected:/app/data/collected
    # One hourly loop, three steps: feed due sources, run the collection QA sweep
    # (recover stale running rows + verify snapshot hashes), then the
    # account-retention sweep. The sweep exits 1 on abnormal state; the loop
    # prints one alert line and keeps going, so alerting never stops feeding.
    command: ["sh", "-c", "while true; do python /app/scripts/collection_scheduler.py; python /app/scripts/collection_sweep.py || echo 'collection_sweep_abnormal exit=1' >&2; python /app/scripts/account_retention_sweeper.py --limit 50; sleep 3600; done"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html-site:ro
      - /opt/zoubeacon/web:/usr/share/nginx/html-corp:ro
      - /opt/zoubeacon/certs:/etc/nginx/certs:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
