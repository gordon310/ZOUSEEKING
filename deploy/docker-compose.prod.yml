# This compose deployment replaces the existing zoubeacon-nginx single
# container after the cutover steps in deploy/README.md are completed.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    expose:
      - "8000"

  # NOTE: collection worker writes under /app/data inside the container (ephemeral); add a bind mount if outputs must persist across restarts.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    command: ["python", "/app/scripts/collection_worker.py", "--loop", "60", "--interval", "10"]

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: .env
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python /app/scripts/collection_scheduler.py; sleep 3600; done"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html-site:ro
      - /opt/zoubeacon/web:/usr/share/nginx/html-corp:ro
      - /opt/zoubeacon/certs:/etc/nginx/certs:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
