<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mypage｜ZOU SEEKING HOUSE 小象搜房日本</title>
    <link rel="stylesheet" href="styles.css?v=20260824-8" />
  </head>
  <body>
    <main class="app">
      <nav class="topbar" aria-label="页面导航">
        <a class="topbar-brand" href="index.html">
          <img src="assets/logoELE.png" alt="LOGOELE" />
          <span>ZOU SEEKING HOUSE</span>
        </a>
        <div class="topbar-links">
          <a href="index.html">首页</a>
          <a href="mypage.html" aria-current="page">我的</a>
        </div>
      </nav>

      <header class="hero">
        <div class="brand">
          <img src="assets/logoELE.png" alt="LOGOELE" />
          <div>
            <p class="eyebrow">ZOU SEEKING HOUSE</p>
            <h1>我的数据工作台</h1>
          </div>
        </div>
        <p class="hero-copy">查过什么、跑到哪一步、结果能不能看，都放这里。首页负责好看，Mypage 负责干活。</p>
      </header>

      <section class="account-panel" id="accountPanel">
        <div class="account-head">
          <div>
            <p class="eyebrow">Account</p>
            <h2 id="accountTitle">登录后可以查看 Mypage</h2>
          </div>
          <button class="ghost-button hidden" id="logoutButton" type="button">退出</button>
        </div>

        <p class="account-copy" id="accountCopy">未登录不能查看自己的查询任务。小象很八卦，但还是讲隐私。</p>

        <div class="account-tabs" id="accountTabs">
          <button class="tab active" id="showLogin" type="button">登录</button>
          <button class="tab" id="showRegister" type="button">注册</button>
        </div>

        <form class="account-form" id="loginForm">
          <input id="loginUsername" type="email" placeholder="邮件" autocomplete="username" />
          <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" />
          <button type="submit">登录 Mypage</button>
        </form>

        <form class="account-form hidden" id="registerForm">
          <input id="registerUsername" type="text" placeholder="用户名" autocomplete="username" />
          <input id="registerEmail" type="email" placeholder="邮件" autocomplete="email" />
          <input id="registerPassword" type="password" placeholder="密码" autocomplete="new-password" />
          <button type="submit">注册并登录</button>
        </form>

        <p class="form-message" id="formMessage"></p>
      </section>

      <section class="mypage-panel hidden" id="mypagePanel">
        <div class="section-title">
          <p class="eyebrow">Mypage</p>
          <h2>我的查询任务</h2>
        </div>
        <div class="stats-grid" id="myStats"></div>
        <section class="profile-card" id="profileCard">
          <div class="mypage-head">
            <div>
              <p class="eyebrow">Profile</p>
              <h3>我的资料</h3>
            </div>
            <button class="ghost-button" id="editProfileButton" type="button">编辑</button>
          </div>
          <div class="profile-summary" id="profileSummary"></div>
          <form class="profile-form hidden" id="profileForm">
            <label>
              昵称
              <input id="profileDisplayName" type="text" placeholder="比如：Gordon" />
            </label>
            <label>
              邮箱
              <input id="profileEmail" type="email" disabled />
            </label>
            <label>
              所在城市
              <input id="profileCity" type="text" placeholder="比如：东京 / 大阪 / 上海" />
            </label>
            <label>
              关注区域
              <input id="profileFavoriteArea" type="text" placeholder="比如：东京港区、大阪北区" />
            </label>
            <label>
              关注房型
              <select id="profileFavoriteAssetType">
                <option value="">还没想好</option>
                <option value="塔楼">塔楼</option>
                <option value="公寓">公寓</option>
                <option value="一户建">一户建</option>
              </select>
            </label>
            <label class="profile-full">
              备注
              <textarea id="profileBio" rows="3" placeholder="比如：先看租售比，钱包暂时保持沉默。"></textarea>
            </label>
            <div class="profile-actions">
              <button class="primary" type="submit">保存资料</button>
              <button type="button" id="cancelProfileButton">取消</button>
            </div>
          </form>
        </section>
        <div class="mypage-head">
          <p class="query-hint">这里可以看自己的查询记录，手动执行 JPHOUSE，完成后点查看结果。</p>
          <button class="ghost-button" id="refreshMyPage" type="button">刷新</button>
        </div>
        <div class="task-list" id="myTaskList"></div>
      </section>

      <section class="detail-page hidden" id="detailPage">
        <button class="back-button" id="backToList" type="button">← 返回 Mypage</button>
        <div id="detailContent"></div>
      </section>
    </main>

    <dialog class="image-dialog" id="imageDialog">
      <button class="image-close" id="closeImage" type="button">×</button>
      <img id="largeImage" alt="放大图片" />
    </dialog>

    <dialog class="progress-dialog" id="progressDialog">
      <div class="progress-card">
        <p class="eyebrow">JPHOUSE 正在干活</p>
        <h2 id="progressTitle">准备查询</h2>
        <div class="progress-track"><span id="progressBar"></span></div>
        <ol id="progressSteps"></ol>
      </div>
    </dialog>

    <script src="config.js?v=20260824-8"></script>
    <script src="app.js?v=20260824-8"></script>
  </body>
</html>
