[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-property-publisher"
version = "0.1.0"
description = "Authorized Japanese property data analysis and Xiaohongshu draft generation"
requires-python = ">=3.9"

[project.scripts]
jp-property-publisher = "jp_property_publisher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
