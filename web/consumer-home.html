<!doctype html>
<html lang="ja" data-default-locale="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="日本の物件資料を提出し、資料の充足度、リスク、次に確認すべき項目を整理します。" />
    <title>小象避坑｜日本の物件資料分析</title>
    <link rel="icon" href="assets/logoELE-beacon.svg?v=20261010-r70" />
    <link rel="manifest" href="manifest.webmanifest?v=20261010-r70" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="stylesheet" href="property-analysis.css?v=20261010-r70" />
    <style>
      .consumer-home { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
      .consumer-home-card { width: min(100%, 760px); padding: clamp(32px, 7vw, 72px); border: 1px solid #dfe5ef; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgb(16 40 77 / 10%); }
      .consumer-home-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .consumer-home-toolbar .eyebrow { margin: 0; font-size: 16px; }
      .consumer-home-locale { flex: none; margin: 0; }
      .consumer-home-locale select { min-height: 40px; border: 1px solid #b9c5d8; border-radius: 10px; color: #10284d; background: #fff; padding: 7px 34px 7px 11px; font-weight: 700; }
      .consumer-home-card h1 { max-width: 620px; margin: 18px 0 14px; color: #10284d; font-size: clamp(34px, 7vw, 64px); line-height: 1.08; }
      .consumer-home-card p { max-width: 590px; color: #53627a; font-size: 18px; line-height: 1.7; }
      .consumer-home-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .consumer-home-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 10px; text-decoration: none; }
      .consumer-home-actions .primary-action { color: #fff; background: #10284d; }
      .consumer-home-note { margin-top: 28px; font-size: 14px !important; }
      @media (max-width: 520px) {
        .consumer-home-toolbar { align-items: flex-start; flex-direction: column; gap: 12px; }
        .consumer-home-locale, .consumer-home-locale select { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="consumer-home">
      <section class="consumer-home-card" aria-labelledby="consumerHomeTitle">
        <div class="consumer-home-toolbar">
          <p class="eyebrow">小象避坑 / ZOUBEACON</p>
          <label class="consumer-home-locale">
            <span class="sr-only" data-i18n="locale.label">表示言語</span>
            <select data-locale-switcher data-i18n-aria-label="locale.label" aria-label="表示言語">
              <option value="ja">日本語</option>
              <option value="zh-CN">简体中文</option>
              <option value="zh-Hant">繁體中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
        <h1 id="consumerHomeTitle" data-i18n="consumerHome.title">日本の物件を見極めてから、次の一歩を決める。</h1>
        <p data-i18n="consumerHome.copy">登録またはログイン後、適法に保有する物件資料を提出し、資料の充足度、潜在的なリスク、追加確認が必要な項目を確認できます。結果は専門家による取引調査の代替ではありません。</p>
        <div class="consumer-home-actions">
          <a class="primary-action" href="consumer-profile.html#accountPanel" data-i18n="consumerHome.authCta">登録 / ログイン</a>
        </div>
        <p class="consumer-home-note" data-i18n="consumerHome.note">ログイン後、物件分析を開始し、自分のプロジェクトやレポートを確認できます。</p>
      </section>
    </main>
    <script src="js/i18n.js?v=20261010-r70" defer></script>
    <script src="js/pwa.js?v=20261010-r70" defer></script>
  </body>
</html>
