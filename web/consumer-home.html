<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="提交日本物件资料，先看清资料完整度、风险和下一步。" />
    <title>小象避坑｜日本物件资料分析</title>
    <link rel="icon" href="assets/logoELE-beacon.svg?v=20260917-r56" />
    <link rel="stylesheet" href="property-analysis.css?v=20260917-r56" />
    <style>
      .consumer-home { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
      .consumer-home-card { width: min(100%, 760px); padding: clamp(32px, 7vw, 72px); border: 1px solid #dfe5ef; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgb(16 40 77 / 10%); }
      .consumer-home-card h1 { max-width: 620px; margin: 18px 0 14px; color: #10284d; font-size: clamp(34px, 7vw, 64px); line-height: 1.08; }
      .consumer-home-card p { max-width: 590px; color: #53627a; font-size: 18px; line-height: 1.7; }
      .consumer-home-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .consumer-home-actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 10px; text-decoration: none; }
      .consumer-home-actions .primary-action { color: #fff; background: #10284d; }
      .consumer-home-actions .secondary-action { color: #10284d; border: 1px solid #b9c5d8; }
      .consumer-home-note { margin-top: 28px; font-size: 14px !important; }
    </style>
  </head>
  <body>
    <main class="consumer-home">
      <section class="consumer-home-card" aria-labelledby="consumerHomeTitle">
        <p class="eyebrow">小象避坑 / ZOUBEACON</p>
        <h1 id="consumerHomeTitle">先看清一个日本物件，再决定下一步。</h1>
        <p>提交你合法持有的物件资料，先查看资料完整度、潜在风险和需要补齐的核查项目。免费预览不替代专业交易核查。</p>
        <div class="consumer-home-actions">
          <a class="primary-action" href="property-analysis.html">开始分析一个物件</a>
          <a class="secondary-action" href="profile.html?role=consumer#accountPanel">登录 / 注册</a>
        </div>
        <p class="consumer-home-note">已有项目？登录后可继续查看自己的项目和报告。</p>
      </section>
    </main>
  </body>
</html>
