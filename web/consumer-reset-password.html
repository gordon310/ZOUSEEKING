<!doctype html>
<html lang="ja" data-default-locale="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="小象避坑のログインパスワードを再設定します。" />
    <meta name="theme-color" content="#f4f7fb" />
    <link rel="icon" href="assets/logoELE-beacon.svg?v=20261010-r70" />
    <title>パスワードを再設定｜小象避坑 ZOUBEACON</title>
    <link rel="stylesheet" href="styles.css?v=20261010-r70" />
    <link rel="stylesheet" href="business.css?v=20261010-r70" />
    <link rel="stylesheet" href="consumer-account.css?v=20261010-r70" />
  </head>
  <body class="consumer-app auth-pending" data-role="consumer">
    <a class="skip-link" href="#resetPanel">本文へ移動</a>
    <main class="app">
      <nav class="topbar" aria-label="小象避坑のナビゲーション">
        <a class="topbar-brand" href="consumer-home.html" aria-label="小象避坑 ZOUBEACON">
          <img class="brand-mark" src="assets/logoELE-beacon.svg?v=20261010-r70" alt="" width="48" height="48" />
          <span class="topbar-brand-copy" translate="no"><strong>小象避坑</strong><small>ZOUBEACON</small></span>
        </a>
        <nav class="topbar-links" aria-label="小象避坑の機能">
          <a href="property-analysis.html">物件を分析</a>
          <a href="projects.html">マイプロジェクト</a>
          <a href="consumer-profile.html">アカウント</a>
        </nav>
        <label class="locale-switcher">
          <span class="visually-hidden" data-i18n="locale.label">表示言語</span>
          <select data-locale-switcher data-i18n-aria-label="locale.label" aria-label="表示言語">
            <option value="ja">日本語</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </nav>

      <section class="account-panel consumer-account-panel reset-panel" id="resetPanel" aria-labelledby="resetPageTitle">
        <p class="eyebrow">ZOUBEACON ACCOUNT</p>
        <h1 id="resetPageTitle" data-i18n="account.resetPageTitle">パスワードを再設定</h1>
        <p id="resetPageCopy" data-i18n="account.resetPageCopy">新しいログインパスワードを設定してください。</p>
        <p id="resetStatus" class="form-message" role="status" aria-live="polite"></p>

        <form class="account-form hidden" id="resetPasswordForm">
          <label>
            <span data-i18n="account.resetNewPassword">新しいパスワード</span>
            <input id="resetNewPassword" name="password" type="password" autocomplete="new-password" data-i18n-placeholder="account.passwordShortPlaceholder" placeholder="パスワードを入力" required />
          </label>
          <p class="field-help password-rule" data-i18n="account.passwordRule">パスワードは6〜128文字で、制御文字は使用できません。</p>
          <label>
            <span data-i18n="account.resetConfirmPassword">新しいパスワードを再入力</span>
            <input id="resetConfirmPassword" name="password-confirmation" type="password" autocomplete="new-password" data-i18n-placeholder="account.passwordShortPlaceholder" placeholder="パスワードを入力" required />
          </label>
          <button type="submit" data-i18n="account.resetSubmit">パスワードを更新</button>
        </form>

        <section id="resetInvalidState" hidden>
          <p data-i18n="account.resetInvalidLink">リンクの有効期限が切れています。もう一度お申し込みください。</p>
          <a class="primary-product-link" href="consumer-profile.html#accountPanel" data-i18n="account.resetBackToLogin">ログインへ戻る</a>
        </section>

        <section id="resetSuccessState" hidden>
          <h2 data-i18n="account.resetSuccess">パスワードを更新しました</h2>
          <p data-i18n="account.resetSuccessCopy">新しいパスワードでログインできます。</p>
          <a class="primary-product-link" href="consumer-profile.html#accountPanel" data-i18n="account.resetBackToLogin">ログインへ戻る</a>
        </section>
      </section>
    </main>

    <script src="config.js?v=20261010-r70"></script>
    <script src="js/i18n.js?v=20261010-r70"></script>
    <script src="js/auth-recovery.js?v=20261010-r70"></script>
    <script src="js/reset-password.js?v=20261010-r70"></script>
  </body>
</html>
