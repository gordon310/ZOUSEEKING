          <img class="brand-mark" src="assets/logoELE-beacon.svg?v=20260916-r41" alt="" aria-hidden="true" />
          <span class="topbar-brand-copy"><strong data-i18n="brand.business">小象数据</strong><small>ZOUSEEKING</small></span>
        </a>
        <nav class="topbar-links" aria-label="小象数据功能" data-i18n-aria-label="nav.businessFunctions">
          <a href="data-query.html"><span data-i18n="nav.query">数据查询</span></a>
          <a href="analysis.html"><span data-i18n="nav.analysis">统计分析</span></a>
          <a href="mypage.html"><span data-i18n="nav.workspace">数据与服务工作台</span></a>
          <a href="profile.html"><span data-i18n="nav.profile">账户资料</span></a>
        </nav>
        <label class="locale-switcher">
          <span class="visually-hidden" data-i18n="locale.label">界面语言</span>
          <select data-locale-switcher aria-label="界面语言" data-i18n-aria-label="locale.label">
            <option value="zh-CN">简体中文</option>
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>

      <aside class="business-side-card" aria-labelledby="organizationAccountHeading">
        <p class="eyebrow">BUSINESS SPACE</p>
        <h2 id="organizationAccountHeading">—</h2>
        <p class="business-side-copy" id="organizationPlanName">正在读取……</p>
        <dl class="business-side-meta">
          <div><dt data-i18n="business.role">角色</dt><dd id="organizationRole">—</dd></div>
          <div><dt data-i18n="business.organization">机构</dt><dd id="organizationName">—</dd></div>
          <div><dt data-i18n="business.seats">席位</dt><dd id="businessSeatSummary">正在读取……</dd></div>
        </dl>
        <a class="business-button secondary" href="profile.html" data-i18n="business.openProfile">打开账户资料</a>
        <nav class="business-side-links" aria-label="更多 B 端功能" data-i18n-aria-label="business.tools">

      <header class="hero">
        <div class="brand">
          <img class="brand-mark" src="assets/logoELE-beacon.svg?v=20260916-r41" alt="" aria-hidden="true" />
          <div>
            <p class="eyebrow" data-i18n="hero.business">小象数据 / ZOUSEEKING</p>
            <h1 data-i18n="hero.organizationTitle">机构与成员</h1>
          </div>
        </div>
        <p class="hero-copy" data-i18n="hero.organizationCopy">查看机构席位、成员角色和合作方状态。</p>
      </header>

      <section class="business-page-panel" aria-labelledby="organizationHeading">
        <div class="business-panel-heading">
          <div>
            <p class="eyebrow">ORGANIZATION</p>
            <h2 id="organizationHeading" data-i18n="business.organizationSection">机构成员</h2>
          </div>
        </div>
        <p class="business-panel-copy" data-i18n="business.organizationCopy">查看当前机构的席位、成员角色和状态。</p>
        <div class="business-toolbar">
          <span id="organizationSeatSummary">正在读取……</span>
          <button class="business-button" id="inviteMemberButton" type="button" hidden data-i18n="business.inviteMember">邀请成员</button>
        </div>
        <p class="business-notice" id="organizationNotice" aria-live="polite" data-i18n="business.organizationLoading">正在读取机构信息……</p>
        <form class="business-form" id="organizationInviteForm" hidden>
          <label for="inviteEmail" data-i18n="business.inviteeEmail">受邀邮箱</label>
          <input id="inviteEmail" name="email" type="email" autocomplete="email" required />
          <label for="inviteRole" data-i18n="business.inviteeRole">角色</label>
          <select id="inviteRole" name="role"><option value="member" data-i18n="business.memberRole">协作成员</option><option value="admin" data-i18n="business.adminRole">机构管理员</option></select>
          <button class="business-button" type="submit" data-i18n="business.createInvite">生成一次性链接</button>
          <p id="inviteResult" class="business-notice" aria-live="polite"></p>
        </form>
        <section aria-labelledby="pendingInvitationsHeading">
          <h3 id="pendingInvitationsHeading" data-i18n="business.pendingInvitations">待处理邀请</h3>
          <div id="organizationInvitations"></div>
        </section>
        <div class="business-table-wrap">
          <table class="business-table business-member-table">
            <caption data-i18n="business.organizationSection">机构成员</caption>
            <thead>
              <tr><th scope="col" data-i18n="business.memberName">成员</th><th scope="col" data-i18n="business.role">角色</th><th scope="col" data-i18n="business.status">状态</th><th scope="col" data-i18n="business.lastActive">最近活动</th><th scope="col" data-i18n="business.action">操作</th></tr>
            </thead>
            <tbody id="organizationMembers"></tbody>
          </table>
        </div>
      </section>
