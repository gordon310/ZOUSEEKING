<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="设置新的登录密码。" />
    <link rel="manifest" href="manifest.webmanifest?v=20260912-r9" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20260912-r9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="小象" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="assets/logoELE-beacon.svg?v=20260912-r9" />
    <title data-i18n="account.resetPageTitle">设置新密码</title>
    <link rel="stylesheet" href="styles.css?v=20260912-r9" />
    <link rel="stylesheet" href="business.css?v=20260912-r9" />
  </head>
  <body class="business-app auth-pending">
    <main class="business-page">
      <header class="topbar">
        <a class="topbar-brand" href="index.html" aria-label="小象数据 ZOUSEEKING">
          <img src="assets/logoELE-beacon.svg?v=20260912-r9" alt="" width="34" height="34" />
          <span>小象数据 / ZOUSEEKING</span>
        </a>
        <label class="locale-switcher">
          <span class="visually-hidden" data-i18n="locale.label">界面语言</span>
          <select data-locale-switcher data-i18n-aria-label="locale.label">
            <option value="zh-CN">简体中文</option>
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
      </header>

      <section class="account-panel reset-panel" aria-labelledby="resetPageTitle">
        <p class="eyebrow" data-i18n="account.eyebrow">Account</p>
        <h1 id="resetPageTitle" data-i18n="account.resetPageTitle">设置新密码</h1>
        <p id="resetPageCopy" data-i18n="account.resetPageCopy">请设置一个新的登录密码。</p>
        <p id="resetStatus" class="form-message" role="status" aria-live="polite"></p>

        <form class="account-form hidden" id="resetPasswordForm">
          <label>
            <span data-i18n="account.resetNewPassword">新密码</span>
            <input id="resetNewPassword" type="password" autocomplete="new-password" data-i18n-placeholder="account.passwordShortPlaceholder" placeholder="至少 12 位" required />
          </label>
          <label>
            <span data-i18n="account.resetConfirmPassword">确认新密码</span>
            <input id="resetConfirmPassword" type="password" autocomplete="new-password" data-i18n-placeholder="account.passwordShortPlaceholder" placeholder="至少 12 位" required />
          </label>
          <button type="submit" data-i18n="account.resetSubmit">更新密码</button>
        </form>

        <section id="resetInvalidState" hidden>
          <p data-i18n="account.resetInvalidLink">链接已失效，请重新申请。</p>
          <a class="primary-product-link" href="index.html#forgot-password" data-i18n="account.resetBackToLogin">返回登录入口</a>
        </section>

        <section id="resetSuccessState" hidden>
          <h2 data-i18n="account.resetSuccess">密码已更新</h2>
          <p data-i18n="account.resetSuccessCopy">你可以使用新密码登录账户。</p>
          <a class="primary-product-link" href="index.html" data-i18n="account.resetBackToLogin">返回登录入口</a>
        </section>
      </section>
    </main>

    <script src="config.js?v=20260912-r9"></script>
    <script src="js/pwa.js?v=20260912-r9"></script>
    <script src="js/i18n.js?v=20260912-r9"></script>
    <script src="js/auth-recovery.js?v=20260912-r9"></script>
    <script src="js/reset-password.js?v=20260912-r9"></script>
  </body>
</html>
